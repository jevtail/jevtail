name = "jevtail"
main = "../apps/server/src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "jevtail"
database_id = "REPLACE_WITH_YOUR_D1_ID"   # wrangler d1 create jevtail

# secrets (wrangler secret put NAME --config deploy/wrangler.toml):
#   TYPESAFE_API_KEY, JEVTAIL_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#   SLACK_WEBHOOK_URL, DISCORD_WEBHOOK_URL, VERCEL_VERIFY
[vars]
JEVTAIL_REJUDGE_HOURS = "24"
JEVTAIL_ALERT_COOLDOWN_MIN = "60"
